<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开门模拟器</title>
    <link rel="stylesheet" href="样式.css">
</head>

<body>
    <div class="容器">
        <header class="头部">
            <h1>开门模拟器</h1>
            <p class="副标题">你只是想开个门。就这么简单。</p>
        </header>

        <main class="主区域">
            <div class="门框">
                <div class="门" id="门">
                    <div class="门把手"></div>
                    <div class="门牌">出</div>
                </div>
            </div>

            <button class="开门按钮" id="开门按钮">
                🚪 点击开门
            </button>

            <p class="提示" id="提示">门就在那里。它在等你。</p>
        </main>

        <footer class="底部">
            <p>© 2025 开门模拟器 · 筷子许可证 🥢</p>
            <p class="警告">⚠️ 开门可能需要 3-7 个工作日</p>
        </footer>
    </div>

    <script src="开门.js"></script>
</body>

</html>
